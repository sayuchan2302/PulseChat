spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  port: ${SERVER_PORT:8081}

app:
  schema:
    self-heal-message-type-check: false
  rate-limit:
    window-seconds: 900
    login-max-attempts: 1000
    register-max-attempts: 1000
    refresh-max-attempts: 10000
    room-member-adds-max: 1000

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4173,http://127.0.0.1:4173}

logging:
  level:
    root: WARN
    com.chatapp: INFO

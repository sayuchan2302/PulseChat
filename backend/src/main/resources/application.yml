spring:
  application:
    name: chat-app-backend

  flyway:
    enabled: false

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chat-app}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/api}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}
  media-expiration: ${JWT_MEDIA_EXPIRATION:86400000}

auth:
  refresh-cookie:
    name: ${REFRESH_COOKIE_NAME:chat_refresh_token}
    path: ${REFRESH_COOKIE_PATH:/api/auth}
    secure: ${REFRESH_COOKIE_SECURE:false}
    same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:4173,http://127.0.0.1:4173,http://localhost:3000,http://127.0.0.1:3000}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
  allowed-headers: ${CORS_ALLOWED_HEADERS:*}
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}

app:
  admin:
    bootstrap-username: ${ADMIN_BOOTSTRAP_USERNAME:}
  rate-limit:
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:900}
    login-max-attempts: ${RATE_LIMIT_LOGIN_MAX:10}
    register-max-attempts: ${RATE_LIMIT_REGISTER_MAX:10}
    refresh-max-attempts: ${RATE_LIMIT_REFRESH_MAX:60}
    room-member-adds-max: ${RATE_LIMIT_ROOM_MEMBER_ADDS_MAX:100}
  uploads:
    avatar-dir: ${AVATAR_UPLOAD_DIR:uploads/avatars}
    media-dir: ${MEDIA_UPLOAD_DIR:uploads/media}

cloudinary:
  public-uploads-enabled: ${CLOUDINARY_PUBLIC_UPLOADS_ENABLED:false}
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  upload-folder: ${CLOUDINARY_UPLOAD_FOLDER:chat-app/messages}
  allowed-formats: ${CLOUDINARY_ALLOWED_FORMATS:jpg,png,webp,gif,mp4,webm,mov,avi,mkv,mp3,ogg,wav,pdf,zip,doc,docx,xls,xlsx,ppt,pptx,txt,csv,json}
  daily-signature-quota: ${CLOUDINARY_DAILY_SIGNATURE_QUOTA:100}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.1-flash-lite}

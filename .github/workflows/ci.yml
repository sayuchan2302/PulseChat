name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run backend tests
        run: ./mvnw -B test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check CSS coverage
        run: npm run check:css
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chat-app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
      E2E_SERVERS_MANAGED: 'true'
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: chat-app
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_PROFILES_ACTIVE: e2e
      SERVER_PORT: '8081'
      JWT_SECRET: cHVsc2VjaGF0LWV2ZS1vbmx5LXNlY3JldC1rZXktMDEyMzQ1Njc4OWFiY2RlZmdoaWprbG1ub3A=
      CORS_ALLOWED_ORIGINS: http://localhost:4173,http://127.0.0.1:4173
      AVATAR_UPLOAD_DIR: uploads/e2e/avatars
      MEDIA_UPLOAD_DIR: uploads/e2e/media
      VITE_API_BASE_URL: http://localhost:8081/api
      VITE_WS_BASE_URL: http://localhost:8081/api/ws
      VITE_RTC_STUN_URLS: ''
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build E2E backend
        working-directory: backend
        timeout-minutes: 8
        run: ./mvnw -B -Dmaven.test.skip=true package
      - name: Start E2E backend
        working-directory: backend
        timeout-minutes: 4
        run: |
          java -jar target/chat-app-backend-*.jar > ../frontend/e2e-backend.log 2>&1 &
          echo $! > ../frontend/e2e-backend.pid
          for attempt in $(seq 1 90); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/users || true)
            if [ "$status" = "200" ] || [ "$status" = "401" ]; then
              exit 0
            fi
            sleep 2
          done
          tail -n 200 ../frontend/e2e-backend.log
          exit 1
      - name: Start Vite
        timeout-minutes: 2
        run: |
          npm run dev -- --port 4173 --strictPort > e2e-vite.log 2>&1 &
          echo $! > e2e-vite.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:4173/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          tail -n 100 e2e-vite.log
          exit 1
      - name: Run browser E2E
        timeout-minutes: 10
        run: npm run test:e2e
      - name: Publish E2E diagnostics
        if: always()
        run: |
          {
            echo '### Browser E2E logs'
            echo '#### Backend'
            echo '```'
            tail -n 160 e2e-backend.log 2>/dev/null || true
            echo '```'
            echo '#### Vite'
            echo '```'
            tail -n 80 e2e-vite.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          kill "$(cat e2e-vite.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat e2e-backend.pid 2>/dev/null)" 2>/dev/null || true
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/e2e-backend.log
            frontend/e2e-vite.log
          retention-days: 7
